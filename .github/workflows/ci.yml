name: OIX CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Independent-process demo
        run: python examples/agent_a.py
      - name: Independent multi-node discovery demo
        run: python examples/multi_node_discovery_demo.py
      - name: Lint
        run: ruff check .
      - name: Security lint
        run: bandit -q -r src
